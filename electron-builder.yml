appId: com.chizh.lily
productName: Lily
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - src/**
  - dist/**
  - package.json
  - node_modules/ffmpeg-static/**/*
asarUnpack:
  - node_modules/ffmpeg-static/**/*
mac:
  target:
    - dmg
  artifactName: Lily-mac.${ext}
win:
  target:
    - nsis
  artifactName: Lily-windows.${ext}
